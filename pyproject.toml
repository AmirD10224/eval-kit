[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalkit-oss"
version = "0.1.0"
description = "Production-grade eval harness for LLM apps: synthetic data, calibrated LLM-as-judge, regression detection, and a GitHub Action that auto-rejects regressing PRs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amir Dhibi", email = "amir10.dhibi@gmail.com" }]
keywords = [
    "llm",
    "evaluation",
    "eval",
    "rag",
    "ragas",
    "inspect-ai",
    "promptfoo",
    "anthropic",
    "claude",
    "ci",
    "github-action",
    "regression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
ragas = ["ragas>=0.2.0"]
inspect = ["inspect-ai>=0.3.50"]
promptfoo = []
langfuse = ["langfuse>=2.40.0"]
braintrust = ["braintrust>=0.0.140"]
render = ["playwright>=1.44.0", "jinja2>=3.1.4"]
all = [
    "ragas>=0.2.0",
    "inspect-ai>=0.3.50",
    "langfuse>=2.40.0",
    "braintrust>=0.0.140",
    "playwright>=1.44.0",
    "jinja2>=3.1.4",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "types-PyYAML>=6.0.12",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "jinja2>=3.1.4",
]

[project.urls]
Homepage = "https://github.com/AmirD10224/eval-kit"
Documentation = "https://AmirD10224.github.io/eval-kit/"
Repository = "https://github.com/AmirD10224/eval-kit"
Issues = "https://github.com/AmirD10224/eval-kit/issues"
Changelog = "https://github.com/AmirD10224/eval-kit/blob/main/CHANGELOG.md"

[project.scripts]
evalkit = "evalkit.cli:_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "examples", "action"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "TCH", # flake8-type-checking
    "PL",  # pylint
    "ARG", # flake8-unused-arguments
    "RET", # flake8-return
    "S",   # flake8-bandit
    "ANN", # flake8-annotations
]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison
    "S101",    # assert (we use it in tests)
    "ANN401",  # any-type (some adapters need it)
    "TC001",   # type-only first-party imports (we use `from __future__ import annotations`)
    "TC002",   # type-only third-party imports (same reason)
    "TC003",   # type-only stdlib imports (same reason)
    "ANN001",  # missing-arg-type (covered by mypy strict)
    "ANN002",  # missing-args-type
    "ANN003",  # missing-kwargs-type
    "ANN201",  # missing-return-type-public
    "ANN202",  # missing-return-type-private
    "ANN204",  # missing-return-type-special-method
    "ANN205",  # missing-return-type-staticmethod
    "ANN206",  # missing-return-type-classmethod
    "N818",    # exception names: we use Failure/Detected suffixes by design
    "S603",    # subprocess (we only call our own git binary with hardcoded args)
    "S607",    # partial-executable-path (same: trust PATH for `git`)
    "UP047",   # generic-via-type-parameters (we still target widely-supported syntax)
    "PLR0912", # too-many-branches (the markdown→html mini-parser is intentionally branchy)
    "PLR0915", # too-many-statements (compute_agreement intentionally long)
    "RUF002",  # ambiguous unicode (− α κ are intentional in math docstrings)
    "RUF003",  # same, in comments
    "PLW3301", # nested max() (clarity > flatness in formula code)
    "PLW0108", # unnecessary lambda (sometimes needed for type narrowing)
    "S311",    # non-crypto random (we use it for a deterministic bootstrap CI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "PLR", "ARG", "PLC0415", "PT018", "PT030", "RUF059", "SIM117"]
"examples/**/*.py" = ["S", "ANN", "PLR", "ARG"]
"src/evalkit/cli.py" = ["PLC0415"]  # lazy imports: avoid loading anthropic/ragas when CLI isn't using them

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
files = ["src/evalkit"]

[[tool.mypy.overrides]]
module = [
    "ragas.*",
    "inspect_ai.*",
    "langfuse.*",
    "braintrust.*",
    "playwright.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Note: coverage flags live in CI invocations (see .github/workflows/ci.yml),
# not here, so contributors running a focused subset (`pytest tests/unit/test_X.py`)
# don't trip the project-wide cov gate. The full suite + gate run in CI.
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: tests that hit real Anthropic API (require ANTHROPIC_API_KEY)",
    "slow: tests that take >1s",
    "integration: end-to-end tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
branch = true
source = ["src/evalkit"]
omit = [
    "src/evalkit/_version.py",
    "src/evalkit/adapters/langfuse.py",
    "src/evalkit/adapters/braintrust.py",
    "src/evalkit/render/screenshot.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
fail_under = 85
show_missing = true
skip_covered = false
